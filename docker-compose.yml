# 依存スタック (MCP 本体はホストで起動)
#
# 推奨利用パターン:
#
#   # 開発標準 (Postgres + Ollama)
#   docker compose up -d postgres ollama
#   # 初回モデル導入ログ
#   docker compose logs -f ollama-init
#
#   # 観測性も含めてフル起動
#   docker compose --profile observability up -d
#
#   # 全停止
#   docker compose down
#   # DB データも含めて完全削除 (通常運用では非推奨)
#   docker compose down -v
#
# エンドポイント:
#   - PostgreSQL:    localhost:5432
#   - Jaeger UI:     http://localhost:16686
#   - Prometheus UI: http://localhost:9090
#   - Grafana UI:    http://localhost:3000  (admin/admin)
#   - Ollama API:    http://localhost:11434
#   - MCP HTTP:      http://localhost:3800/mcp  (profile: mcp-http)
#
# MCP サーバ側 (.env):
#   DATABASE_URL=postgres://sfai:sfai@localhost:5432/sfai
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#   PROMETHEUS_METRICS_PORT=9464
#   OLLAMA_BASE_URL=http://localhost:11434
#
# 任意: 初回導入モデルを変更する場合
#   OLLAMA_INIT_MODELS="qwen2.5:3b nomic-embed-text:latest"

services:
  # ---- PostgreSQL + pgvector ----------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sfai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sfai}
      POSTGRES_DB: ${POSTGRES_DB:-sfai}
      # local compose 用: パスワード変数を compose に直書きせずに起動するため trust を使用
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  # ---- Ollama (LLM / Embedding 既定提供) -----------------------------------
  # 既定で起動。ホストにネイティブ Ollama を入れている場合は事前停止すること
  # (ポート 11434 競合)。
  ollama:
    image: ollama/ollama:0.21.2
    container_name: sfai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU を使いたい場合 (NVIDIA + Docker Desktop GPU サポート有効時):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 初回モデル導入用の one-shot ジョブ。
  # - 既に pull 済みモデルは再利用される (named volume: ollama-data)
  # - 既定モデルは OLLAMA_INIT_MODELS で上書き可能
  ollama-init:
    image: ollama/ollama:0.21.2
    container_name: sfai-ollama-init
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "/init/ollama-init.sh"]
    volumes:
      - ollama-data:/root/.ollama
      - ./scripts/ollama-init.sh:/init/ollama-init.sh:ro

  # ---- Observability -------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: sfai-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: sfai-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.6.14
    container_name: sfai-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

  mcp-http:
    image: node:22-bookworm
    container_name: sfai-mcp-http
    profiles: ["mcp-http"]
    restart: unless-stopped
    working_dir: /workspace
    command: ["sh", "-lc", "npm ci --ignore-scripts && npx tsx mcp/server.ts"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3800
      DATABASE_URL: postgres://sfai:sfai@postgres:5432/sfai
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3800:3800"
    volumes:
      - ./:/workspace
    depends_on:
      - postgres
      - ollama

volumes:
  grafana-data:
  ollama-data:
  postgres-data:
