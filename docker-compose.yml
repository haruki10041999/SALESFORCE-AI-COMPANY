# 依存スタック (MCP 本体はホストで起動)
#
# 推奨利用パターン:
#
#   # 開発標準 (Postgres + Ollama)
#   docker compose up -d postgres ollama
#   # 初回モデル導入ログ
#   docker compose logs -f ollama-init
#
#   # 観測性も含めてフル起動
#   docker compose --profile observability up -d
#
#   # 全停止
#   docker compose down
#   # DB データも含めて完全削除 (通常運用では非推奨)
#   docker compose down -v
#
# エンドポイント:
#   - PostgreSQL:    localhost:5432
#   - Temporal gRPC: localhost:7233  (profile: workflow)
#   - Temporal UI:   http://localhost:8088  (profile: workflow)
#   - Qdrant REST:   http://localhost:6333  (profile: vector-qdrant)
#   - Qdrant gRPC:   localhost:6334         (profile: vector-qdrant)
#   - Replay UI:     http://localhost:3001  (profile: replay-ui)
#   - Ollama HA:     http://localhost:11444 (profile: ollama-ha)
#   - Jaeger UI:     http://localhost:16686
#   - Prometheus UI: http://localhost:9090
#   - Grafana UI:    http://localhost:3000  (admin/admin)
#   - Ollama API:    http://localhost:11434
#   - MCP HTTP:      http://localhost:3800/mcp  (profile: mcp-http)
#
# MCP サーバ側 (.env):
#   DATABASE_URL=postgres://sfai:sfai@localhost:5432/sfai
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#   PROMETHEUS_METRICS_PORT=9464
#   OLLAMA_BASE_URL=http://localhost:11434
#   SF_AI_WORKFLOW_ENGINE=in-process
#   SF_AI_TEMPORAL_ADDRESS=localhost:7233
#   SF_AI_TEMPORAL_NAMESPACE=default
#   SF_AI_TEMPORAL_TASK_QUEUE=sfai-orchestration
#
# 任意: 初回導入モデルを変更する場合
#   OLLAMA_INIT_MODELS="qwen2.5:3b nomic-embed-text:latest"

services:
  # ---- PostgreSQL + pgvector ----------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sfai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sfai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfai}
      POSTGRES_DB: ${POSTGRES_DB:-sfai}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  # ---- Ollama (LLM / Embedding 既定提供) -----------------------------------
  # 既定で起動。ホストにネイティブ Ollama を入れている場合は事前停止すること
  # (ポート 11434 競合)。
  ollama:
    image: ollama/ollama:0.21.2
    container_name: sfai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU を使いたい場合 (NVIDIA + Docker Desktop GPU サポート有効時):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # 初回モデル導入用の one-shot ジョブ。
  # - 既に pull 済みモデルは再利用される (named volume: ollama-data)
  # - 既定モデルは OLLAMA_INIT_MODELS で上書き可能
  ollama-init:
    image: ollama/ollama:0.21.2
    container_name: sfai-ollama-init
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "/init/ollama-init.sh"]
    volumes:
      - ollama-data:/root/.ollama
      - ./scripts/ollama-init.sh:/init/ollama-init.sh:ro

  # ---------------------------------------------------------------------------
  # Ollama HA example (profile: ollama-ha)
  # Usage: docker compose --profile ollama-ha up -d ollama-1 ollama-2 ollama-haproxy
  # MCP: OLLAMA_BASE_URL=http://localhost:11444
  # ---------------------------------------------------------------------------
  ollama-1:
    image: ollama/ollama:0.21.2
    container_name: sfai-ollama-1
    profiles: ["ollama-ha"]
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama1-data:/root/.ollama

  ollama-2:
    image: ollama/ollama:0.21.2
    container_name: sfai-ollama-2
    profiles: ["ollama-ha"]
    restart: unless-stopped
    ports:
      - "11436:11434"
    volumes:
      - ollama2-data:/root/.ollama

  ollama-haproxy:
    image: haproxy:3.1-alpine
    container_name: sfai-ollama-haproxy
    profiles: ["ollama-ha"]
    restart: unless-stopped
    depends_on:
      - ollama-1
      - ollama-2
    ports:
      - "11444:11434"
    volumes:
      - ./infra/llm/ollama-haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  # ---- Observability -------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: sfai-jaeger
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: sfai-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/slo-rules.yaml:/etc/prometheus/slo-rules.yaml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.6.14
    container_name: sfai-grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

  # ---- Durable Workflow (Temporal POC) -------------------------------------
  temporal-postgres:
    image: postgres:16
    container_name: sfai-temporal-postgres
    profiles: ["workflow"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: sfai-temporal
    profiles: ["workflow"]
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.39.0
    container_name: sfai-temporal-ui
    profiles: ["workflow"]
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    ports:
      - "8088:8080"

  mcp-http:
    image: node:22-bookworm
    container_name: sfai-mcp-http
    profiles: ["mcp-http"]
    restart: unless-stopped
    working_dir: /workspace
    command: ["sh", "-lc", "npm ci --ignore-scripts && npx tsx mcp/server.ts"]
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3800
      DATABASE_URL: postgres://sfai:sfai@postgres:5432/sfai
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3800:3800"
    volumes:
      - ./:/workspace
    depends_on:
      - postgres
      - ollama

  # ---------------------------------------------------------------------------
  # Vector DB — Qdrant (profile: vector-qdrant)
  # Usage: docker compose --profile vector-qdrant up -d qdrant
  # MCP: SF_AI_VECTOR_BACKEND=qdrant  QDRANT_URL=http://localhost:6333
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: sfai-qdrant
    profiles: ["vector-qdrant"]
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

  # ---------------------------------------------------------------------------
  # Replay Debugger UI (profile: replay-ui)
  # Serves the static HTML UI on port 3001.
  # The UI fetches data from the MCP HTTP transport's /replay/* endpoints.
  # Usage: docker compose --profile replay-ui up -d replay-ui
  # Then open: http://localhost:3001?api=http://localhost:3800
  # ---------------------------------------------------------------------------
  replay-ui:
    image: nginx:1.27-alpine
    container_name: sfai-replay-ui
    profiles: ["replay-ui"]
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./infra/replay-ui:/usr/share/nginx/html:ro

volumes:
  grafana-data:
  qdrant-data:
  ollama-data:
  ollama1-data:
  ollama2-data:
  postgres-data:
  temporal-postgres-data:
