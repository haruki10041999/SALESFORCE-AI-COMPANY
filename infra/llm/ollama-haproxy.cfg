global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    option redispatch
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 3

frontend ollama_frontend
    bind *:11434
    default_backend ollama_backends

backend ollama_backends
    balance roundrobin
    option httpchk GET /api/tags
    http-check expect status 200
    server ollama1 ollama-1:11434 check
    server ollama2 ollama-2:11434 check
