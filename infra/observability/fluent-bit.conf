[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         tail
    Path         /var/log/sf-ai/audit/*.jsonl
    Tag          sfai.audit
    DB           /var/log/sf-ai/audit/flb_audit.db
    Mem_Buf_Limit 10MB
    Skip_Long_Lines On

[FILTER]
    Name         modify
    Match        sfai.audit
    Add          service salesforce-ai-company
    Add          source sf-ai-audit

[OUTPUT]
    Name         http
    Match        sfai.audit
    Host         ${SF_AI_SIEM_HOST}
    Port         ${SF_AI_SIEM_PORT}
    URI          ${SF_AI_SIEM_URI}
    Format       json_lines
    Header       Content-Type application/json
    Header       Authorization Bearer ${SF_AI_SIEM_TOKEN}
    Retry_Limit  False
