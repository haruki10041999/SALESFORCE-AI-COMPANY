global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/slo-rules.yaml

scrape_configs:
  - job_name: salesforce-ai-company
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9464
        labels:
          service: salesforce-ai-company
