apiVersion: v1
kind: Service
metadata:
  name: sf-ai-postgres-primary
  labels:
    app.kubernetes.io/name: sf-ai-postgres
    app.kubernetes.io/component: primary
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: sf-ai-postgres
    role: primary
---
apiVersion: v1
kind: Service
metadata:
  name: sf-ai-postgres-replica
  labels:
    app.kubernetes.io/name: sf-ai-postgres
    app.kubernetes.io/component: replica
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: sf-ai-postgres
    role: replica