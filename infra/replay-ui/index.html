<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Replay Debugger — Salesforce AI Runtime</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --added: #4ade80;
      --removed: #f87171;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }
    header span { color: var(--muted); font-size: 12px; }
    .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 49px); overflow: hidden; }
    .sidebar { border-right: 1px solid var(--border); overflow-y: auto; }
    .sidebar-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
    .sidebar-header h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    input, select {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 6px 10px; border-radius: 6px; font-size: 13px; width: 100%;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      background: var(--accent); color: #0f172a; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button:hover { opacity: .85; }
    button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .stream-list { padding: 8px 0; }
    .stream-item {
      padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent;
      transition: background .1s;
    }
    .stream-item:hover { background: rgba(56,189,248,.06); }
    .stream-item.active { background: rgba(56,189,248,.12); border-left-color: var(--accent); }
    .stream-item .sid { font-size: 12px; color: var(--accent); font-family: monospace; word-break: break-all; }
    .stream-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .main { overflow-y: auto; padding: 16px 20px; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar label { font-size: 12px; color: var(--muted); }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .tab { padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover { color: var(--text); }
    .event-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .event-table th { text-align: left; padding: 6px 10px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
    .event-table td { padding: 6px 10px; border-bottom: 1px solid rgba(51,65,85,.5); vertical-align: top; }
    .event-table tr:hover td { background: rgba(56,189,248,.04); }
    .event-table tr.selected td { background: rgba(56,189,248,.1); }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.active { background: rgba(74,222,128,.15); color: var(--added); }
    .badge.tombstoned { background: rgba(248,113,113,.15); color: var(--removed); }
    .badge.type { background: rgba(56,189,248,.15); color: var(--accent); font-family: monospace; }
    .payload-panel { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .payload-panel-header { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    pre.payload { padding: 12px 14px; font-family: "Fira Code", monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
    .diff-row { display: flex; gap: 16px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .diff-col { flex: 1; }
    .diff-col h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .diff-col.added h4 { color: var(--added); }
    .diff-col.removed h4 { color: var(--removed); }
    .diff-empty { color: var(--muted); font-size: 12px; font-style: italic; }
    .empty-state { padding: 48px 0; text-align: center; color: var(--muted); }
    .loading { padding: 24px; text-align: center; color: var(--muted); font-style: italic; }
    .error-msg { padding: 12px 14px; background: rgba(248,113,113,.1); color: var(--removed); border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .seq-badge { font-family: monospace; font-size: 11px; color: var(--muted); }
    .mono { font-family: monospace; }
    .nowrap { white-space: nowrap; }
    .stream-count { font-size: 11px; color: var(--muted); margin-left: auto; }
  </style>
</head>
<body>

<header>
  <h1>⏪ Replay Debugger</h1>
  <span>Salesforce AI Runtime — read-only event store viewer</span>
  <span id="api-url" style="margin-left:auto;color:var(--muted);font-family:monospace;font-size:11px;"></span>
</header>

<div class="layout">
  <!-- SIDEBAR: Stream list -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Streams</h2>
      <input id="prefix-input" type="text" placeholder="プレフィックスフィルター (例: session:)" value="session:" />
      <input id="tenant-input" type="text" placeholder="テナント ID (任意)" />
      <div style="display:flex;gap:6px">
        <button id="load-streams-btn">読み込み</button>
        <span class="stream-count" id="stream-count"></span>
      </div>
    </div>
    <div class="stream-list" id="stream-list">
      <div class="empty-state">「読み込み」を押してください</div>
    </div>
  </aside>

  <!-- MAIN: Event detail -->
  <main class="main">
    <div id="main-empty" class="empty-state">← ストリームを選択してください</div>
    <div id="main-content" style="display:none">
      <div class="toolbar">
        <label>ストリーム:</label>
        <span id="selected-stream" class="mono" style="color:var(--accent)"></span>
        <button class="secondary" id="refresh-btn" style="margin-left:auto">更新</button>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="timeline">タイムライン</div>
        <div class="tab" data-tab="diff">Payload Diff</div>
      </div>

      <div id="error-area"></div>
      <div id="loading-area" class="loading" style="display:none">読み込み中...</div>

      <!-- Timeline tab -->
      <div id="tab-timeline">
        <table class="event-table">
          <thead>
            <tr>
              <th>Seq</th><th>Ver</th><th>Event Type</th><th>Actor</th><th>Status</th><th>Occurred At</th>
            </tr>
          </thead>
          <tbody id="events-tbody"></tbody>
        </table>
        <div id="payload-panel" class="payload-panel" style="display:none">
          <div class="payload-panel-header">
            <span id="payload-title">Payload</span>
            <button class="secondary" id="close-payload-btn" style="padding:2px 8px;font-size:11px">✕</button>
          </div>
          <pre class="payload" id="payload-content"></pre>
        </div>
      </div>

      <!-- Diff tab -->
      <div id="tab-diff" style="display:none">
        <div id="diff-content"></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  // ---------------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------------
  const BASE_URL = (() => {
    const params = new URLSearchParams(location.search);
    return (params.get("api") ?? `${location.protocol}//${location.hostname}:${location.port || (location.protocol === 'https:' ? '443' : '3800')}`).replace(/\/$/, "");
  })();
  document.getElementById("api-url").textContent = BASE_URL + "/replay/...";

  // ---------------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------------
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString("ja-JP", { dateStyle: "short", timeStyle: "medium" });
  }
  function showError(msg) {
    el("error-area").innerHTML = `<div class="error-msg">${esc(msg)}</div>`;
  }
  function clearError() { el("error-area").innerHTML = ""; }
  function setLoading(v) { el("loading-area").style.display = v ? "" : "none"; }

  async function apiFetch(path) {
    const resp = await fetch(BASE_URL + path);
    if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText} — ${path}`);
    return resp.json();
  }

  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  let selectedStreamId = null;
  let activeTab = "timeline";
  let events = [];

  // ---------------------------------------------------------------------------
  // Load streams
  // ---------------------------------------------------------------------------
  el("load-streams-btn").addEventListener("click", loadStreams);
  async function loadStreams() {
    const prefix = el("prefix-input").value.trim();
    const tenant = el("tenant-input").value.trim();
    const params = new URLSearchParams();
    if (prefix) params.set("prefix", prefix);
    if (tenant) params.set("tenantId", tenant);
    params.set("limit", "100");
    el("stream-list").innerHTML = '<div class="loading">読み込み中...</div>';
    clearError();
    try {
      const data = await apiFetch(`/replay/streams?${params}`);
      renderStreamList(data.streams ?? []);
    } catch (e) {
      el("stream-list").innerHTML = '<div class="empty-state">エラー</div>';
      showError(e.message);
    }
  }

  function renderStreamList(streams) {
    el("stream-count").textContent = `${streams.length} 件`;
    if (!streams.length) {
      el("stream-list").innerHTML = '<div class="empty-state">ストリームが見つかりません</div>';
      return;
    }
    el("stream-list").innerHTML = streams.map(s => `
      <div class="stream-item${s.streamId === selectedStreamId ? " active" : ""}"
           data-sid="${esc(s.streamId)}">
        <div class="sid">${esc(s.streamId)}</div>
        <div class="meta">${s.eventCount} events · ${fmt(s.lastAt)}</div>
      </div>
    `).join("");
    el("stream-list").querySelectorAll(".stream-item").forEach(item => {
      item.addEventListener("click", () => selectStream(item.dataset.sid));
    });
  }

  // ---------------------------------------------------------------------------
  // Select stream
  // ---------------------------------------------------------------------------
  async function selectStream(streamId) {
    selectedStreamId = streamId;
    el("selected-stream").textContent = streamId;
    el("main-empty").style.display = "none";
    el("main-content").style.display = "";
    // Highlight
    el("stream-list").querySelectorAll(".stream-item").forEach(i => {
      i.classList.toggle("active", i.dataset.sid === streamId);
    });
    hidePayload();
    await loadTab();
  }

  el("refresh-btn").addEventListener("click", loadTab);

  async function loadTab() {
    if (!selectedStreamId) return;
    clearError();
    setLoading(true);
    try {
      if (activeTab === "timeline") {
        await loadTimeline();
      } else {
        await loadDiff();
      }
    } catch (e) {
      showError(e.message);
    } finally {
      setLoading(false);
    }
  }

  // ---------------------------------------------------------------------------
  // Timeline tab
  // ---------------------------------------------------------------------------
  async function loadTimeline() {
    const tenant = el("tenant-input").value.trim();
    const params = new URLSearchParams({ limit: "500" });
    if (tenant) params.set("tenantId", tenant);
    const sid = encodeURIComponent(selectedStreamId);
    const data = await apiFetch(`/replay/stream/${sid}/events?${params}`);
    events = data.events ?? [];
    renderTimeline(events);
  }

  function renderTimeline(evs) {
    if (!evs.length) {
      el("events-tbody").innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">イベントなし</td></tr>';
      return;
    }
    el("events-tbody").innerHTML = evs.map((ev, i) => `
      <tr data-idx="${i}" style="cursor:pointer">
        <td class="seq-badge">${ev.globalSeq}</td>
        <td class="mono">${ev.version}</td>
        <td><span class="badge type">${esc(ev.eventType)}</span></td>
        <td class="muted">${esc(ev.actorId ?? "—")}</td>
        <td><span class="badge ${esc(ev.status)}">${esc(ev.status)}</span></td>
        <td class="nowrap" style="color:var(--muted);font-size:12px">${fmt(ev.occurredAt)}</td>
      </tr>
    `).join("");
    el("events-tbody").querySelectorAll("tr").forEach(row => {
      row.addEventListener("click", () => {
        el("events-tbody").querySelectorAll("tr").forEach(r => r.classList.remove("selected"));
        row.classList.add("selected");
        showPayload(events[Number(row.dataset.idx)]);
      });
    });
  }

  function showPayload(ev) {
    el("payload-title").textContent = `Payload — ${ev.eventType} v${ev.version}`;
    el("payload-content").textContent = JSON.stringify(ev.payload, null, 2);
    el("payload-panel").style.display = "";
    el("payload-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function hidePayload() {
    el("payload-panel").style.display = "none";
    el("events-tbody").querySelectorAll("tr").forEach(r => r.classList.remove("selected"));
  }
  el("close-payload-btn").addEventListener("click", hidePayload);

  // ---------------------------------------------------------------------------
  // Diff tab
  // ---------------------------------------------------------------------------
  async function loadDiff() {
    const tenant = el("tenant-input").value.trim();
    const params = new URLSearchParams();
    if (tenant) params.set("tenantId", tenant);
    const sid = encodeURIComponent(selectedStreamId);
    const data = await apiFetch(`/replay/stream/${sid}/diff?${params}`);
    renderDiff(data.diffs ?? []);
  }

  function renderDiff(diffs) {
    if (!diffs.length) {
      el("diff-content").innerHTML = '<div class="empty-state">差分なし</div>';
      return;
    }
    el("diff-content").innerHTML = diffs.map(d => {
      const hasAdded = Object.keys(d.added).length > 0;
      const hasRemoved = Object.keys(d.removed).length > 0;
      return `
        <div class="diff-row">
          <div style="min-width:90px">
            <div class="mono" style="font-size:12px;color:var(--muted)">v${d.version}</div>
            <div><span class="badge type">${esc(d.eventType)}</span></div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">${fmt(d.occurredAt)}</div>
          </div>
          <div class="diff-col added">
            <h4>追加 / 変更</h4>
            ${hasAdded
              ? `<pre class="payload" style="max-height:160px">${esc(JSON.stringify(d.added, null, 2))}</pre>`
              : '<div class="diff-empty">変更なし</div>'}
          </div>
          <div class="diff-col removed">
            <h4>削除 / 旧値</h4>
            ${hasRemoved
              ? `<pre class="payload" style="max-height:160px">${esc(JSON.stringify(d.removed, null, 2))}</pre>`
              : '<div class="diff-empty">変更なし</div>'}
          </div>
        </div>
      `;
    }).join("");
  }

  // ---------------------------------------------------------------------------
  // Tabs
  // ---------------------------------------------------------------------------
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      activeTab = tab.dataset.tab;
      el("tab-timeline").style.display = activeTab === "timeline" ? "" : "none";
      el("tab-diff").style.display = activeTab === "diff" ? "" : "none";
      hidePayload();
      loadTab();
    });
  });
</script>
</body>
</html>
