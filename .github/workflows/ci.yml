name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint core layers
        run: npm run lint:core-layers

      - name: Dependency cruiser layer rules
        run: npm run lint:depcruise

      - name: Lint outputs schema
        run: npm run lint:outputs

      - name: Lint docs source-of-truth
        run: npm run lint:docs

      - name: Selective test run
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:selective -- --base origin/main --head HEAD

      - name: Full test (Windows safety net)
        if: matrix.os == 'windows-latest'
        run: npm test

      - name: Tool test matrix
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:matrix -- --fail-on-missing

      - name: Generate tool manifest
        if: matrix.os == 'ubuntu-latest'
        run: npm run docs:manifest

      - name: Check tool compatibility
        if: matrix.os == 'ubuntu-latest'
        run: npm run tools:compat -- --baseline-ref origin/main --fail-on-breaking

      - name: Verify tool manifest integrity
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! node -e "JSON.parse(require('fs').readFileSync('docs/generated/internal/tool-manifest.json', 'utf-8'))" 2>/dev/null; then
            echo "❌ tool-manifest.json is invalid JSON"
            exit 1
          fi
          echo "✅ tool-manifest.json integrity verified"

      - name: Run benchmark suite
        if: matrix.os == 'ubuntu-latest'
        run: npm run benchmark:run -- --limit 200

      - name: Verify benchmark output
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ ! -f "outputs/reports/benchmark-suite.json" ]; then
            echo "❌ benchmark-suite.json not found"
            exit 1
          fi
          echo "✅ benchmark-suite.json generated"

      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit:deps

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sfai
          POSTGRES_PASSWORD: sfai
          POSTGRES_DB: sfai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfai -d sfai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postgres integration test
        env:
          SF_AI_STATE_BACKEND: postgres
          DATABASE_URL: postgres://sfai:sfai@localhost:5432/sfai
        run: npm test -- tests/postgres-state-store.test.ts

  temporal-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Temporal workflow stack
        run: docker compose --profile workflow up -d temporal-postgres temporal temporal-ui

      - name: Run Temporal integration test
        env:
          SF_AI_TEMPORAL_INTEGRATION: "true"
          SF_AI_TEMPORAL_ADDRESS: localhost:7233
          SF_AI_TEMPORAL_NAMESPACE: default
        run: node --import tsx --test tests/temporal-workflow.integration.test.ts

      - name: Dump Temporal stack logs on failure
        if: failure()
        run: docker compose --profile workflow logs temporal-postgres temporal temporal-ui

      - name: Stop Temporal workflow stack
        if: always()
        run: docker compose --profile workflow down -v
